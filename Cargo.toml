[package]
name = "hkdf-tree"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Deterministic hierarchical passphrase derivation from a master seed via HKDF-SHA256"
license = "BSD-2-Clause"
repository = "https://github.com/enk-ode/hkdf-tree"
readme = "README.md"
keywords = ["hkdf", "passphrase", "derivation", "cryptography", "cli"]
categories = ["command-line-utilities", "cryptography"]

[dependencies]
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
hkdf = "0.12"
printpdf = { version = "0.7", default-features = false }
qrcode = { version = "0.14", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_yaml_ng = "0.10"
sha2 = "0.10"
zeroize = { version = "1.7", features = ["derive"] }
thiserror = "1.0"

[dev-dependencies]
assert_cmd = "2.0"
indoc = "2.0"
predicates = "3.1"
tempfile = "3.10"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
